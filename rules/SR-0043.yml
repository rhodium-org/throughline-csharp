uid: SR-0043
type: system_requirement
status: approved
title: Do not use var when the type is not apparent
text: >-
  Do not use var when the type is not apparent from the right side; do not assume a method
  name makes the type clear, and use an explicit type rather than the variable name to
  convey it.
links:
- target: UR-0008
  type: implements
attrs:
  source_ref: "Microsoft C# Coding Conventions: Language — Implicit Typing and Operators"
