uid: SR-0047
type: system_requirement
status: approved
title: Qualify a static member with its own class name
text: >-
  Call a static member through its class name (ClassName.StaticMember) and never qualify a
  base-class static member with the name of a derived class.
links:
- target: UR-0008
  type: implements
attrs:
  source_ref: "Microsoft C# Coding Conventions: Language — Implicit Typing and Operators"
