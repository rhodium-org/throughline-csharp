uid: SR-0004
type: system_requirement
status: approved
title: Never use two consecutive underscores in a name
text: >-
  Do not use two consecutive underscore (__) characters in an identifier; those names are
  reserved for compiler-generated identifiers.
links:
- target: UR-0001
  type: implements
attrs:
