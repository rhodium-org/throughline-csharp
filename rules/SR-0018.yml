uid: SR-0018
type: system_requirement
status: approved
title: Give generic type parameters descriptive names
text: >-
  Name a generic type parameter with a descriptive name, unless a single-letter name is
  completely self-explanatory and a descriptive name would add no value.
links:
- target: UR-0003
  type: implements
