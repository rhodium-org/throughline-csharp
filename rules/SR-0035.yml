uid: SR-0035
type: system_requirement
status: approved
title: Use a concise instantiation form when types match
text: >-
  Use a concise object-instantiation form (var x = new T() or T x = new()) when the
  variable type matches the object type; this form is not valid when the variable is an
  interface or a base class of the runtime type.
links:
