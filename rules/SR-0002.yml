uid: SR-0002
type: system_requirement
status: proposed
title: Use only permitted Unicode characters in identifiers
text: After the first character, use only Unicode letter, decimal-digit, connecting,
  combining or formatting characters; any character outside these categories is replaced
  with an underscore.
normative: true
links:
- target: UR-0001
  type: implements
