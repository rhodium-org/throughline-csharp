uid: SR-0033
type: system_requirement
status: approved
title: Use Func<> and Action<> instead of custom delegate types
text: >-
  Use Func<> and Action<> instead of defining your own delegate types, and call the method
  through the signature the delegate defines.
links:
- target: UR-0005
  type: implements
