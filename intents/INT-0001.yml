uid: INT-0001
type: intent
status: approved
title: C# is written in one consistent, correct, readable style
text: >-
  Microsoft's C# coding conventions exist so that C# code — and the samples and
  documentation that teach it — reads as though written by one author: consistent naming,
  layout and language-feature choices that favour clarity, correctness and modern idioms,
  so that any developer can read, copy, change and maintain code they did not write.
normative: false
attrs:
  source_ref: "Microsoft C# Coding Conventions"
